<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#666;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#666;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="#f5f5f5"/>

  <g transform="translate(150, 0)">
    <!-- Phone -->
    <rect x="0" y="50" width="500" height="900" rx="40" fill="url(#phone)" stroke="#444" stroke-width="4"/>

    <!-- Screen -->
    <rect x="20" y="120" width="460" height="700" rx="10" fill="#1e1e1e"/>

    <!-- Notifications area -->
    <circle cx="250" cy="80" r="6" fill="#666"/>
    <circle cx="280" cy="80" r="6" fill="#666"/>
    <circle cx="310" cy="80" r="6" fill="#666"/>

    <!-- Flashcard 1 -->
    <rect x="40" y="150" width="380" height="250" rx="15" fill="url(#card)" stroke="#444" stroke-width="2"/>
    <rect x="50" y="160" width="360" height="80" rx="8" fill="url(#text)"/>
    <text x="250" y="205" text-anchor="middle" fill="#ccc" font-family="sans-serif" font-size="24" font-weight="bold">What is spaced repetition?</text>
    <rect x="50" y="260" width="360" height="120" rx="8" fill="url(#text)"/>
    <text x="250" y="330" text-anchor="middle" fill="#aaa" font-family="sans-serif" font-size="18">A learning technique where cards are reviewed at increasing intervals to combat the forgetting curve.</text>
    <rect x="150" y="420" width="80" height="30" rx="5" fill="#0ea5e9"/>
    <text x="190" y="440" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">Again</text>
    <rect x="270" y="420" width="80" height="30" rx="5" fill="#64748b"/>
    <text x="310" y="440" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">Hard</text>
    <rect x="150" y="460" width="80" height="30" rx="5" fill="#64748b"/>
    <text x="190" y="480" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">Good</text>
    <rect x="270" y="460" width="80" height="30" rx="5" fill="#22c55e"/>
    <text x="310" y="480" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">Easy</text>

    <!-- Progress bar -->
    <rect x="40" y="850" width="380" height="6" rx="3" fill="#333"/>
    <rect x="40" y="850" width="200" height="6" rx="3" fill="#0ea5e9"/>

    <!-- Bottom nav -->
    <rect x="20" y="840" width="460" height="80" rx="15" fill="#2d2d2d"/>
    <circle cx="100" cy="880" r="15" fill="#0ea5e9"/>
    <circle cx="250" cy="880" r="15" fill="#444"/>
    <circle cx="400" cy="880" r="15" fill="#444"/>
  </g>

  <!-- Labels -->
  <text x="400" y="1000" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">FIG. 01 — Daily Review · iOS</text>
</svg>
